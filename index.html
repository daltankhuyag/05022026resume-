<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALTANKHUYAG DASH </title>
  <meta name="description" content="Architecture design, project manager and  planning grounded in restraint, place, and material honesty." />
  <meta property="og:title" content="ALTANKHUYAG Dash — Architect stundet - Project Manager" />
  <meta property="og:description" content="Selected work, biography, and writing." />
  <meta property="og:type" content="website" />

  <!-- React via CDN -->
  <script crossorigin src="react.min.js"></script>
  <script crossorigin src="react-dom.min.js"></script>
  <script src="babel.min.js"></script>
  <script>
    // Babel 8 defaults to the new JSX transform which emits
    // `import { jsx } from "react/jsx-runtime"` — incompatible with CDN globals.
    // Wrap the built-in react preset to force the classic runtime (React.createElement).
    const _reactPreset = Babel.availablePresets['react'];
    Babel.availablePresets['react'] = function(api, opts) {
      return _reactPreset(api, Object.assign({ runtime: 'classic' }, opts));
    };
  </script>
  <script src="pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';
  </script>

  <!-- Tailwind via CDN with dark mode = class -->
  <script src="tailwind.min.js"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
    // Apply theme before paint to avoid flash
    (function () {
      try {
        const t = window.__theme || 'light';
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=Fraunces:opsz,wght@9..144,200;9..144,300;9..144,400;9..144,500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #f4f2eb;
      --surface: #e9e6dc;
      --ink: #0a0a0c;
      --muted: #5e5d63;
      --rule: #c8c5b9;
      --accent: #0a0a0c;
      --bronze: #0a0a0c;
      --stone: #5e5d63;
      --plaster: #f4f2eb;
      --plaster-2: #e9e6dc;
    }
    .dark {
      --bg: #0f0d0b;
      --surface: #17140f;
      --ink: #f4f2eb;
      --muted: #6a6870;
      --rule: #242018;
      --accent: #f4f2eb;
      --bronze: #f4f2eb;
      --stone: #6a6870;
      --plaster: #0f0d0b;
      --plaster-2: #17140f;
    }

    html, body { background: var(--bg); color: var(--ink); }
    html { font-size: 17.5px; }
    @media (max-width: 640px) { html { font-size: 16.5px; } }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 300;
      background:
        linear-gradient(115deg, rgba(255, 255, 255, 0.04), transparent 38%),
        repeating-radial-gradient(circle at 12% 16%, rgba(10, 10, 12, 0.022) 0 1.1px, transparent 1.1px 16px),
        repeating-radial-gradient(circle at 82% 78%, rgba(10, 10, 12, 0.018) 0 1px, transparent 1px 22px),
        repeating-radial-gradient(circle at 58% 38%, rgba(10, 10, 12, 0.014) 0 1px, transparent 1px 28px),
        radial-gradient(circle at 14% 18%, rgba(162, 127, 89, 0.09), transparent 20%),
        radial-gradient(circle at 84% 11%, rgba(94, 112, 130, 0.08), transparent 18%),
        radial-gradient(circle at 70% 76%, rgba(128, 112, 92, 0.06), transparent 20%),
        var(--bg);
      background-size: auto, 520px 520px, 680px 680px, 820px 820px, auto, auto, auto, auto;
    }
    .dark body {
      background:
        linear-gradient(115deg, rgba(255, 255, 255, 0.03), transparent 38%),
        repeating-radial-gradient(circle at 12% 16%, rgba(255, 255, 255, 0.026) 0 1.1px, transparent 1.1px 16px),
        repeating-radial-gradient(circle at 82% 78%, rgba(255, 255, 255, 0.02) 0 1px, transparent 1px 22px),
        repeating-radial-gradient(circle at 58% 38%, rgba(255, 255, 255, 0.016) 0 1px, transparent 1px 28px),
        radial-gradient(circle at 14% 18%, rgba(202, 174, 124, 0.08), transparent 20%),
        radial-gradient(circle at 84% 11%, rgba(116, 138, 156, 0.07), transparent 18%),
        radial-gradient(circle at 70% 76%, rgba(160, 144, 118, 0.05), transparent 20%),
        var(--bg);
      background-size: auto, 520px 520px, 680px 680px, 820px 820px, auto, auto, auto, auto;
    }
    h1, h2, h3, .serif { font-family: 'Fraunces', Georgia, serif; font-weight: 300; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

    .hero-abstract {
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.24), transparent 26%),
        repeating-radial-gradient(circle at 18% 24%, rgba(10, 10, 12, 0.038) 0 1px, transparent 1px 18px),
        repeating-radial-gradient(circle at 78% 68%, rgba(10, 10, 12, 0.03) 0 1px, transparent 1px 24px),
        repeating-radial-gradient(circle at 58% 42%, rgba(10, 10, 12, 0.02) 0 1px, transparent 1px 31px);
      background-size: auto, 460px 460px, 600px 600px, 760px 760px;
      background-blend-mode: soft-light, normal, normal, normal;
    }
    .dark .hero-abstract {
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.08), transparent 26%),
        repeating-radial-gradient(circle at 18% 24%, rgba(255, 255, 255, 0.048) 0 1px, transparent 1px 18px),
        repeating-radial-gradient(circle at 78% 68%, rgba(255, 255, 255, 0.038) 0 1px, transparent 1px 24px),
        repeating-radial-gradient(circle at 58% 42%, rgba(255, 255, 255, 0.028) 0 1px, transparent 1px 31px);
      background-size: auto, 460px 460px, 600px 600px, 760px 760px;
      background-blend-mode: soft-light, normal, normal, normal;
    }

    .hero-abstract::before,
    .hero-abstract::after {
      content: "";
      position: absolute;
      pointer-events: none;
      border-radius: 9999px;
      filter: blur(74px);
      opacity: 0.58;
      z-index: 0;
      transform: translate3d(0, 0, 0);
    }
    .hero-abstract::before {
      width: 38rem;
      height: 38rem;
      top: -9rem;
      left: -11rem;
      background:
        radial-gradient(circle at 30% 30%, rgba(181, 144, 92, 0.24), transparent 58%),
        radial-gradient(circle at 72% 62%, rgba(92, 122, 144, 0.16), transparent 63%);
    }
    .hero-abstract::after {
      width: 31rem;
      height: 31rem;
      right: -7rem;
      top: 7rem;
      background:
        radial-gradient(circle at 50% 50%, rgba(132, 108, 84, 0.18), transparent 62%);
    }
    .dark .hero-abstract::before {
      background:
        radial-gradient(circle at 30% 30%, rgba(211, 185, 132, 0.12), transparent 58%),
        radial-gradient(circle at 72% 62%, rgba(115, 144, 162, 0.10), transparent 63%);
    }
    .dark .hero-abstract::after {
      background:
        radial-gradient(circle at 50% 50%, rgba(185, 165, 130, 0.10), transparent 62%);
    }
    .hero-abstract > * {
      position: relative;
      z-index: 1;
    }
    @media (max-width: 640px) {
      .hero-abstract::before {
        width: 24rem;
        height: 24rem;
        top: -7rem;
        left: -9rem;
      }
      .hero-abstract::after {
        width: 18rem;
        height: 18rem;
        right: -6rem;
        top: 9rem;
      }
    }

    html { scroll-behavior: smooth; }

    /* Scroll progress bar */
    .progress-bar {
      position: fixed; top: 0; left: 0; height: 2px;
      background: var(--ink); z-index: 100;
      transition: width 60ms linear;
    }

    /* Custom cursor */
    .cursor-dot, .cursor-ring {
      position: fixed; pointer-events: none; z-index: 9999;
      border-radius: 9999px;
      mix-blend-mode: difference;
      transition: transform 120ms ease, width 200ms ease, height 200ms ease, opacity 200ms ease;
    }
    .cursor-dot { width: 6px; height: 6px; background: #fff; }
    .cursor-ring { width: 36px; height: 36px; border: 1px solid #fff; }
    .cursor-ring.hover { width: 64px; height: 64px; }
    @media (max-width: 900px) { .cursor-dot, .cursor-ring { display: none; } }

    /* Reveal on scroll */
    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity .8s ease, transform .8s ease;
      transition-delay: var(--reveal-delay, 0ms);
    }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    .title-letters { display: inline-block; }
    .title-char {
      display: inline-block;
      opacity: 0;
      transform: translateY(22px);
      transition: opacity .65s ease, transform .65s cubic-bezier(.2,.7,.2,1);
      transition-delay: var(--char-delay, 0ms);
      will-change: transform, opacity;
    }
    .reveal.visible .title-char { opacity: 1; transform: translateY(0); }

    /* Marquee */
    @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    .marquee-track { animation: marquee 40s linear infinite; }

    /* Underline link */
    .ul-link { position: relative; }
    .ul-link::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -2px;
      height: 1px; background: currentColor; transform: scaleX(.4); transform-origin: left;
      transition: transform .4s ease;
    }
    .ul-link:hover::after { transform: scaleX(1); }

    /* Project card image hover */
    .card img { transition: transform 1.2s cubic-bezier(.2,.7,.2,1), filter .6s ease; }
    .parallax-media {
      transform: translateY(var(--parallax-offset, 0px)) scale(1.02);
      will-change: transform;
    }
    .card:hover .parallax-media { transform: translateY(var(--parallax-offset, 0px)) scale(1.08); }

    .action-btn {
      transition: transform .25s ease, opacity .25s ease, box-shadow .25s ease;
      will-change: transform;
    }
    .action-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(10, 10, 12, 0.08);
    }

    @keyframes modalFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes modalRise {
      from { opacity: 0; transform: translateY(28px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes imageSlideIn {
      from { opacity: 0; transform: translateX(30px) scale(0.98); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }

    .modal-shell { animation: modalFade .35s ease both; }
    .modal-panel { animation: modalRise .45s cubic-bezier(.2,.7,.2,1) both; }
    .lightbox-image { animation: imageSlideIn .55s cubic-bezier(.2,.7,.2,1) both; }
    .pdf-canvas-ready { animation: modalRise .35s ease both; }

    @media (prefers-reduced-motion: reduce) {
      .reveal,
      .title-char,
      .card img,
      .parallax-media,
      .action-btn,
      .modal-shell,
      .modal-panel,
      .lightbox-image,
      .pdf-canvas-ready {
        animation: none !important;
        transition: none !important;
        transform: none !important;
      }
    }

    /* Hide scrollbar in modal */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }

    /* Loading screen */
    .loader {
      position: fixed; inset: 0; background: var(--bg); color: var(--ink);
      z-index: 200; display: flex; align-items: center; justify-content: center;
      transition: opacity .8s ease, visibility .8s ease;
    }
    .loader.gone { opacity: 0; visibility: hidden; }

    /* Soft section divider with grain */
    .grain { position: relative; }
    .grain::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background-image: radial-gradient(rgba(0,0,0,.04) 1px, transparent 1px);
      background-size: 3px 3px; opacity: .35; mix-blend-mode: multiply;
    }
    .dark .grain::before { background-image: radial-gradient(rgba(255,255,255,.04) 1px, transparent 1px); mix-blend-mode: screen; }

    /* Big text auto-fit */
    .display { letter-spacing: -0.02em; }

    ::selection { background: var(--ink); color: var(--bg); }

    /* Full-screen scroll mode */
    .fs-scroll { scroll-snap-type: y proximity; scroll-padding-top: 4.5rem; }
    .fs-scroll section,
    .fs-scroll header,
    .fs-scroll footer {
      scroll-snap-align: start;
      scroll-snap-stop: normal;
      min-height: 100vh;
    }
    /* Avoid forcing hero/short sections beyond what already fits */
    @media (max-height: 700px) { .fs-scroll section, .fs-scroll header, .fs-scroll footer { min-height: auto; } }
    @media (prefers-reduced-motion: reduce) { .fs-scroll { scroll-snap-type: none; } }

    /* Side dot navigation */
    .side-dots { position: fixed; right: 20px; top: 50%; transform: translateY(-50%); z-index: 35; display: flex; flex-direction: column; gap: 14px; }
    .side-dots button { display: flex; align-items: center; gap: 10px; background: transparent; border: 0; color: var(--muted); cursor: pointer; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; }
    .side-dots .label { opacity: 0; transform: translateX(8px); transition: opacity .25s ease, transform .25s ease; pointer-events: none; }
    .side-dots button:hover .label { opacity: 1; transform: translateX(0); }
    .side-dots .dot { width: 7px; height: 7px; border-radius: 99px; background: transparent; border: 1px solid var(--muted); transition: background .25s ease, transform .25s ease, border-color .25s ease; }
    .side-dots button.active .dot { background: var(--ink); border-color: var(--ink); transform: scale(1.3); }
    .side-dots button.active { color: var(--ink); }
    .side-dots button.active .label { opacity: 1; transform: translateX(0); }
    @media (max-width: 900px) { .side-dots { display: none; } }

    /* ── Coursework document library ── */
    .toolbar{
      display:flex;gap:1.4em;align-items:center;flex-wrap:wrap;
      padding:1.4em 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
      margin-bottom:clamp(28px,4vw,44px);
    }
    .search{flex:1;min-width:220px;display:flex;align-items:center;gap:.8em;}
    .search input{
      width:100%;background:transparent;border:none;outline:none;
      font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink);
      border-bottom:1px solid var(--rule);padding:.6em 0;letter-spacing:.04em;
    }
    .search input:focus{border-color:var(--bronze)}
    .search input::placeholder{color:var(--stone)}
    .filters{display:flex;gap:.6em;flex-wrap:wrap}
    .chip{
      font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
      border:1px solid var(--rule);background:transparent;color:var(--stone);
      padding:.55em 1.1em;border-radius:999px;cursor:pointer;transition:all .18s;
    }
    .chip:hover{color:var(--ink);border-color:var(--ink)}
    .chip.on{background:var(--ink);color:var(--plaster);border-color:var(--ink)}
    .cw-count{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--stone)}
    .doc-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(195px,1fr));
      gap:clamp(12px,1.8vw,20px);
      margin-bottom:clamp(28px,4vw,40px);
    }
    .doc-card{
      border:1px solid var(--rule);background:var(--plaster);
      display:flex;flex-direction:column;
      transition:transform .25s cubic-bezier(.2,.7,.2,1),border-color .25s,box-shadow .25s;
    }
    .doc-card:hover{
      transform:translateY(-4px);
      border-color:var(--muted);
      box-shadow:0 14px 30px -18px rgba(33,29,24,.25);
    }
    .doc-cover{
      aspect-ratio:4/3;position:relative;overflow:hidden;
      background:var(--plaster-2);
      border-bottom:1px solid var(--rule);
      padding:12px;display:flex;flex-direction:column;justify-content:space-between;
    }
    .doc-cover::before{
      content:"";position:absolute;top:0;right:0;border-style:solid;
      border-width:0 20px 20px 0;
      border-color:var(--plaster) var(--plaster) #CFC9BC #CFC9BC;
      filter:drop-shadow(-2px 2px 2px rgba(33,29,24,.12));
    }
    .dark .doc-cover::before{border-color:var(--plaster) var(--plaster) #2e2e38 #2e2e38}
    .doc-cover::after{
      content:"";position:absolute;inset:0;pointer-events:none;
      background:
        repeating-linear-gradient(0deg,transparent 0 19px,rgba(33,29,24,.045) 19px 20px),
        repeating-linear-gradient(90deg,transparent 0 19px,rgba(33,29,24,.045) 19px 20px);
    }
    .dark .doc-cover::after{
      background:
        repeating-linear-gradient(0deg,transparent 0 19px,rgba(235,231,223,.04) 19px 20px),
        repeating-linear-gradient(90deg,transparent 0 19px,rgba(235,231,223,.04) 19px 20px);
    }
    .doc-badge{
      font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.18em;
      color:var(--plaster);background:var(--ink);
      padding:.45em .8em;align-self:flex-start;position:relative;z-index:1;
    }
    .doc-cat{
      font-family:'Fraunces',Georgia,serif;font-style:italic;
      font-size:1.05rem;color:var(--muted);
      line-height:1.2;position:relative;z-index:1;
    }
    .doc-sheets{
      font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;
      text-transform:uppercase;color:var(--stone);position:relative;z-index:1;
    }
    .doc-body{padding:13px 14px 11px;flex:1}
    .doc-body h3{font-size:.9rem;font-weight:600;letter-spacing:-.01em;line-height:1.35}
    .doc-body .doc-meta{
      font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;
      text-transform:uppercase;color:var(--stone);margin-top:.6em;
      display:flex;gap:1em;flex-wrap:wrap;
    }
    .doc-acts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule)}
    .doc-act{
      font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
      padding:.9em 0;text-align:center;text-decoration:none;cursor:pointer;
      background:transparent;color:var(--ink);border:none;transition:all .18s;
    }
    .doc-act.solid{background:var(--ink);color:var(--plaster)}
    .doc-act+.doc-act{border-left:1px solid var(--rule)}
    .doc-act:hover{background:var(--bronze);color:var(--plaster);border-color:var(--bronze)}
    .doc-act:focus-visible{outline:2px solid var(--bronze);outline-offset:-3px}
    .doc-empty{grid-column:1/-1;padding:4em 0;text-align:center;color:var(--stone);font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase}

    /* ── Pagination ── */
    .pagination{display:flex;justify-content:center;align-items:center;gap:.5em;flex-wrap:wrap;padding-bottom:clamp(60px,8vw,100px)}
    .page-btn{
      font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;
      border:1px solid var(--rule);background:transparent;color:var(--ink);
      min-width:2.6em;padding:.55em .7em;cursor:pointer;transition:all .18s;text-align:center;
    }
    .page-btn:hover:not(:disabled){border-color:var(--ink)}
    .page-btn.on{background:var(--ink);color:var(--plaster);border-color:var(--ink)}
    .page-btn:disabled{opacity:.3;cursor:default}

    /* ── Coursework PDF viewer ── */
    .cw-viewer{
      position:fixed;inset:0;z-index:200;
      background:rgba(33,29,24,.88);backdrop-filter:blur(5px);
      display:flex;flex-direction:column;
    }
    .v-bar{
      display:flex;justify-content:space-between;align-items:center;gap:1em;
      padding:10px clamp(12px,2vw,24px);
      background:var(--ink);border-bottom:1px solid rgba(235,231,223,.15);
      color:var(--plaster);
      font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;
      flex-wrap:wrap;flex-shrink:0;
    }
    .v-title{
      text-transform:uppercase;letter-spacing:.14em;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34ch;
    }
    .v-tools{display:flex;align-items:center;gap:.4em;flex-wrap:wrap}
    .v-btn{
      background:transparent;border:1px solid rgba(235,231,223,.3);color:var(--plaster);
      font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;
      padding:.55em .9em;cursor:pointer;transition:all .15s;
      min-width:34px;text-align:center;text-decoration:none;display:inline-block;
    }
    .v-btn:hover{background:var(--bronze);border-color:var(--bronze)}
    .v-btn:disabled{opacity:.35;cursor:default}
    .v-btn:disabled:hover{background:transparent;border-color:rgba(235,231,223,.3)}
    .v-sep{width:1px;height:22px;background:rgba(235,231,223,.25);margin:0 .5em}
    .v-zoom,.v-page{min-width:5.5ch;text-align:center;color:var(--plaster);font-variant-numeric:tabular-nums;}
    .v-stage{
      flex:1;overflow:auto;
      display:flex;justify-content:safe center;align-items:flex-start;
      padding:clamp(14px,3vw,36px);
    }
    .v-stage canvas{background:#fff;box-shadow:0 18px 60px rgba(0,0,0,.5);display:block;margin:auto;}
    .v-msg{
      margin:auto;color:rgba(235,231,223,.75);
      font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.12em;
      text-transform:uppercase;text-align:center;line-height:2;padding:0 1em;
    }
    @media(max-width:720px){.v-title{display:none}.v-bar{justify-content:center}}
    @keyframes scrollBounce {
      0%, 100% { transform: translateY(0); opacity: 0.5; }
      50% { transform: translateY(5px); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo } = React;

    function PdfThumbnail({ file }) {
      const canvasRef = useRef(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(false);
      useEffect(() => {
        if (!file || !canvasRef.current) return;
        let cancelled = false;
        const task = pdfjsLib.getDocument(encodeURI(file));
        setLoading(true);
        setError(false);
        task.promise.then(pdf => pdf.getPage(1)).then(page => {
          if (cancelled) return;
          const vp = page.getViewport({ scale: 1 });
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ratio = window.devicePixelRatio || 1;
          const displayW = canvas.parentElement ? canvas.parentElement.clientWidth || 600 : 600;
          const scale = displayW / vp.width;
          const vp2 = page.getViewport({ scale });
          canvas.width = Math.floor(vp2.width * ratio);
          canvas.height = Math.floor(vp2.height * ratio);
          canvas.style.width = vp2.width + 'px';
          canvas.style.height = vp2.height + 'px';
          const ctx = canvas.getContext('2d');
          ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
          return page.render({ canvasContext: ctx, viewport: vp2 }).promise;
        }).then(() => { if (!cancelled) setLoading(false); })
          .catch(() => { if (!cancelled) { setLoading(false); setError(true); } });
        return () => { cancelled = true; task.destroy(); };
      }, [file]);
      return (
        <div className="w-full relative" style={{ background: 'var(--surface)' }}>
          {loading && <div className="absolute inset-0 flex items-center justify-center mono text-[10px] uppercase tracking-widest" style={{ color: 'var(--muted)' }}>Loading…</div>}
          {error && <div className="absolute inset-0 flex items-center justify-center mono text-[10px] uppercase tracking-widest" style={{ color: 'var(--muted)' }}>Unable to load</div>}
          <canvas ref={canvasRef} className="w-full block" style={{ opacity: loading ? 0 : 1, transition: 'opacity .3s' }} />
        </div>
      );

    function useScrollProgress() {
      const [p, setP] = useState(0);
      useEffect(() => {
        const onScroll = () => {
          const h = document.documentElement;
          const total = h.scrollHeight - h.clientHeight;
          setP(total > 0 ? (h.scrollTop / total) * 100 : 0);
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
        return () => window.removeEventListener('scroll', onScroll);
      }, []);
      return p;
    }

    function useReveal() {
      useEffect(() => {
        const els = document.querySelectorAll('.reveal');
        const io = new IntersectionObserver((entries) => {
          entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
        }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
        els.forEach(el => io.observe(el));
        return () => io.disconnect();
      }, []);
    }

    function useCursor() {
      useEffect(() => {
        if (window.matchMedia('(max-width: 900px)').matches) return;
        const dot = document.createElement('div');
        const ring = document.createElement('div');
        dot.className = 'cursor-dot'; ring.className = 'cursor-ring';
        document.body.appendChild(dot); document.body.appendChild(ring);
        let x = 0, y = 0, rx = 0, ry = 0;
        const move = (e) => { x = e.clientX; y = e.clientY; dot.style.transform = `translate(${x - 3}px, ${y - 3}px)`; };
        const tick = () => { rx += (x - rx) * 0.18; ry += (y - ry) * 0.18; ring.style.transform = `translate(${rx - 18}px, ${ry - 18}px)`; requestAnimationFrame(tick); };
        const onOver = (e) => { if (e.target.closest('a, button, .card')) ring.classList.add('hover'); else ring.classList.remove('hover'); };
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseover', onOver);
        tick();
        return () => { dot.remove(); ring.remove(); window.removeEventListener('mousemove', move); window.removeEventListener('mouseover', onOver); };
      }, []);
    }

    function useCounter(target, run) {
      const [v, setV] = useState(0);
      useEffect(() => {
        if (!run) return;
        let raf, start = null; const dur = 1400;
        const tick = (t) => {
          if (!start) start = t;
          const p = Math.min((t - start) / dur, 1);
          setV(Math.round(target * (0.5 - Math.cos(Math.PI * p) / 2)));
          if (p < 1) raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
      }, [target, run]);
      return v;
    }

    function PdfViewer({ item, onClose }) {
      const pdfUrl = item?.file ? encodeURI(item.file) : '';
      const canvasRef = useRef(null);
      const viewerRef = useRef(null);
      const [pdfDoc, setPdfDoc] = useState(null);
      const [pageNumber, setPageNumber] = useState(1);
      const [pageCount, setPageCount] = useState(0);
      const [zoom, setZoom] = useState(1);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [renderTick, setRenderTick] = useState(0);

      useEffect(() => {
        if (!item) return;
        const onKey = (e) => {
          if (e.key === 'Escape') onClose();
        };
        document.body.style.overflow = 'hidden';
        window.addEventListener('keydown', onKey);
        return () => {
          window.removeEventListener('keydown', onKey);
          document.body.style.overflow = '';
        };
      }, [item, onClose]);

      useEffect(() => {
        if (!item || !pdfUrl) return;
        let cancelled = false;
        const loadingTask = pdfjsLib.getDocument(pdfUrl);
        setLoading(true);
        setError('');
        setPdfDoc(null);
        setPageNumber(1);
        setPageCount(0);
        setZoom(1);

        loadingTask.promise
          .then((pdf) => {
            if (cancelled) {
              pdf.destroy();
              return;
            }
            setPdfDoc(pdf);
            setPageCount(pdf.numPages);
          })
          .catch(() => {
            if (!cancelled) setError('Unable to render this PDF in the viewer.');
          })
          .finally(() => {
            if (!cancelled) setLoading(false);
          });

        return () => {
          cancelled = true;
          loadingTask.destroy();
        };
      }, [item, pdfUrl]);

      useEffect(() => {
        if (!item) return;
        const onResize = () => setRenderTick((value) => value + 1);
        window.addEventListener('resize', onResize);
        return () => window.removeEventListener('resize', onResize);
      }, [item]);

      useEffect(() => {
        if (!pdfDoc || !canvasRef.current || !viewerRef.current) return;
        let cancelled = false;
        let renderTask = null;

        setLoading(true);
        setError('');

        pdfDoc.getPage(pageNumber)
          .then((page) => {
            if (cancelled) return;
            const containerWidth = Math.max(viewerRef.current.clientWidth - 64, 320);
            const baseViewport = page.getViewport({ scale: 1 });
            const fitScale = containerWidth / baseViewport.width;
            const scale = fitScale * zoom;
            const viewport = page.getViewport({ scale });
            const canvas = canvasRef.current;
            const context = canvas.getContext('2d');
            const pixelRatio = window.devicePixelRatio || 1;

            canvas.width = Math.floor(viewport.width * pixelRatio);
            canvas.height = Math.floor(viewport.height * pixelRatio);
            canvas.style.width = `${viewport.width}px`;
            canvas.style.height = `${viewport.height}px`;
            context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

            renderTask = page.render({
              canvasContext: context,
              viewport,
            });

            return renderTask.promise;
          })
          .catch((err) => {
            if (err?.name === 'RenderingCancelledException' || cancelled) return;
            setError('Unable to render this PDF page.');
          })
          .finally(() => {
            if (!cancelled) setLoading(false);
          });

        return () => {
          cancelled = true;
          if (renderTask) renderTask.cancel();
        };
      }, [pdfDoc, pageNumber, renderTick, zoom]);

      if (!item) return null;
      return (
        <div className="fixed inset-0 z-50 modal-shell flex flex-col" style={{ background: 'var(--bg)' }} onClick={onClose}>
          {/* ── Single compact toolbar spanning full width ── */}
          <div
            className="shrink-0 flex items-center justify-between gap-2 px-4 py-2 border-b mono text-[10px] uppercase tracking-widest"
            style={{ borderColor: 'var(--rule)', background: 'var(--bg)' }}
            onClick={(e) => e.stopPropagation()}
          >
            {/* Title + issuer */}
            <div className="min-w-0 flex items-baseline gap-3 overflow-hidden">
              <span className="serif text-sm normal-case truncate" style={{ color: 'var(--ink)', fontFamily: "'Fraunces', Georgia, serif", fontWeight: 300 }}>{item.title}</span>
              <span className="hidden md:inline shrink-0" style={{ color: 'var(--muted)' }}>{item.issuer}{item.year ? ` · ${item.year}` : ''}</span>
            </div>
            {/* Controls */}
            <div className="flex items-center gap-3 shrink-0">
              <button type="button" onClick={() => setZoom(v => Math.max(0.6, Number((v - 0.2).toFixed(2))))} disabled={zoom <= 0.6} className="hover:opacity-60 disabled:opacity-30 transition">−</button>
              <button type="button" onClick={() => setZoom(1)} disabled={zoom === 1} className="hover:opacity-60 disabled:opacity-30 transition w-8 text-center">{Math.round(zoom * 100)}%</button>
              <button type="button" onClick={() => setZoom(v => Math.min(2.4, Number((v + 0.2).toFixed(2))))} disabled={zoom >= 2.4} className="hover:opacity-60 disabled:opacity-30 transition">+</button>
              <span className="opacity-30">|</span>
              <button type="button" onClick={() => setPageNumber(p => Math.max(1, p - 1))} disabled={pageNumber <= 1} className="hover:opacity-60 disabled:opacity-30 transition">Prev</button>
              <span style={{ color: 'var(--muted)' }}>{pageCount ? `${pageNumber} / ${pageCount}` : '…'}</span>
              <button type="button" onClick={() => setPageNumber(p => Math.min(pageCount, p + 1))} disabled={!pageCount || pageNumber >= pageCount} className="hover:opacity-60 disabled:opacity-30 transition">Next</button>
              <span className="opacity-30">|</span>
              <a href={pdfUrl} target="_blank" rel="noreferrer" className="ul-link hover:opacity-60 transition" onClick={e => e.stopPropagation()}>Open ↗</a>
              <a href={pdfUrl} download className="ul-link hover:opacity-60 transition" onClick={e => e.stopPropagation()}>↓</a>
              <button onClick={onClose} className="hover:opacity-60 transition">✕</button>
            </div>
          </div>

          {/* ── Full-height PDF canvas area ── */}
          <div
            ref={viewerRef}
            className="flex-1 overflow-auto no-scrollbar flex justify-center py-6 px-4"
            style={{ background: 'color-mix(in srgb, var(--surface) 40%, white)' }}
            onClick={(e) => e.stopPropagation()}

            <div className="relative flex justify-center w-full">
              {loading ? (
                <div className="absolute inset-0 flex items-center justify-center mono text-[10px] uppercase tracking-widest" style={{ color: 'var(--muted)' }}>
                  Rendering PDF…
                </div>
              ) : null}
              {error ? (
                <div className="absolute inset-0 flex flex-col items-center justify-center gap-4 text-center px-6">
                  <p className="text-sm" style={{ color: 'var(--muted)' }}>{error}</p>
                  <div className="flex items-center gap-4 mono text-[10px] uppercase tracking-widest">
                    <a href={pdfUrl} target="_blank" rel="noreferrer" className="ul-link">Open ↗</a>
                    <a href={pdfUrl} download className="ul-link">Download ↓</a>
                  </div>
                </div>
              ) : null}
              <canvas ref={canvasRef} className={error ? 'hidden' : 'shadow-[0_18px_48px_rgba(0,0,0,0.14)] max-w-full pdf-canvas-ready'} />
            </div>
          </div>
        </div>
      );
    }

    function CourseViewer({ item, onClose }) {
      const pdfUrl = item?.file ? encodeURI(item.file) : '';
      const canvasRef = useRef(null);
      const stageRef  = useRef(null);
      const [pdfDoc,     setPdfDoc]     = useState(null);
      const [pageNumber, setPageNumber] = useState(1);
      const [pageCount,  setPageCount]  = useState(0);
      const [zoom,       setZoom]       = useState(1);
      const [loading,    setLoading]    = useState(false);
      const [error,      setError]      = useState('');
      const [renderTick, setRenderTick] = useState(0);

      useEffect(() => {
        if (!item) return;
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        document.body.style.overflow = 'hidden';
        window.addEventListener('keydown', onKey);
        return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
      }, [item, onClose]);

      useEffect(() => {
        if (!item || !pdfUrl) return;
        let cancelled = false;
        const task = pdfjsLib.getDocument(pdfUrl);
        setLoading(true); setError(''); setPdfDoc(null); setPageNumber(1); setPageCount(0); setZoom(1);
        task.promise
          .then(pdf => { if (cancelled) { pdf.destroy(); return; } setPdfDoc(pdf); setPageCount(pdf.numPages); })
          .catch(() => { if (!cancelled) setError('Unable to load this PDF.'); })
          .finally(() => { if (!cancelled) setLoading(false); });
        return () => { cancelled = true; task.destroy(); };
      }, [item, pdfUrl]);

      useEffect(() => {
        if (!item) return;
        const onResize = () => setRenderTick(v => v + 1);
        window.addEventListener('resize', onResize);
        return () => window.removeEventListener('resize', onResize);
      }, [item]);

      useEffect(() => {
        if (!pdfDoc || !canvasRef.current || !stageRef.current) return;
        let cancelled = false; let renderTask = null;
        setLoading(true); setError('');
        pdfDoc.getPage(pageNumber).then(page => {
          if (cancelled) return;
          const w = Math.max(stageRef.current.clientWidth - 72, 300);
          const baseVp = page.getViewport({ scale: 1 });
          const scale  = (w / baseVp.width) * zoom;
          const vp     = page.getViewport({ scale });
          const canvas = canvasRef.current;
          const ctx    = canvas.getContext('2d');
          const pr     = window.devicePixelRatio || 1;
          canvas.width  = Math.floor(vp.width  * pr);
          canvas.height = Math.floor(vp.height * pr);
          canvas.style.width  = `${vp.width}px`;
          canvas.style.height = `${vp.height}px`;
          ctx.setTransform(pr, 0, 0, pr, 0, 0);
          renderTask = page.render({ canvasContext: ctx, viewport: vp });
          return renderTask.promise;
        }).catch(err => {
          if (err?.name === 'RenderingCancelledException' || cancelled) return;
          setError('Unable to render this page.');
        }).finally(() => { if (!cancelled) setLoading(false); });
        return () => { cancelled = true; if (renderTask) renderTask.cancel(); };
      }, [pdfDoc, pageNumber, renderTick, zoom]);

      if (!item) return null;
      return (
        <div className="cw-viewer">
          <div className="v-bar">
            <span className="v-title">{item.title}</span>
            <div className="v-tools">
              <button className="v-btn" onClick={() => setZoom(v => Math.max(0.5, Number((v - 0.2).toFixed(2))))} disabled={zoom <= 0.5}>−</button>
              <span className="v-zoom">{Math.round(zoom * 100)}%</span>
              <button className="v-btn" onClick={() => setZoom(v => Math.min(3, Number((v + 0.2).toFixed(2))))} disabled={zoom >= 3}>+</button>
              <div className="v-sep" />
              <button className="v-btn" onClick={() => setPageNumber(p => Math.max(1, p - 1))} disabled={pageNumber <= 1}>← Prev</button>
              <span className="v-page">{pageCount ? `${pageNumber} / ${pageCount}` : '…'}</span>
              <button className="v-btn" onClick={() => setPageNumber(p => Math.min(pageCount, p + 1))} disabled={!pageCount || pageNumber >= pageCount}>Next →</button>
              <div className="v-sep" />
              <a className="v-btn" href={pdfUrl} download>↓ Save</a>
              <a className="v-btn" href={pdfUrl} target="_blank" rel="noreferrer">↗ Open</a>
              <button className="v-btn" onClick={onClose}>✕ Close</button>
            </div>
          </div>
          <div className="v-stage" ref={stageRef}>
            {loading && !canvasRef.current?.width
              ? <div className="v-msg">Rendering PDF…</div>
              : null}
            {error
              ? <div className="v-msg">{error}<br /><a className="v-btn" style={{ marginTop: '1em', display: 'inline-block' }} href={pdfUrl} target="_blank" rel="noreferrer">↗ Open in browser</a></div>
              : <canvas ref={canvasRef} style={{ display: loading ? 'none' : 'block' }} />}
          </div>
        </div>
      );
    }

                    <div className="grid md:grid-cols-3 gap-6">
                      <Field label="Preferred date" type="date" value={form.date} onChange={set('date')} min={minDate} required />
                      <Field label="Preferred time" value={form.time} onChange={set('time')} options={timeSlots} required />
                      <Field label="Duration" value={form.duration} onChange={set('duration')} options={durations} required />
                    </div>
                    <Field label="Notes (optional)" value={form.notes} onChange={set('notes')} textarea />
                  </>
                )}

                <div className="flex flex-wrap items-center gap-6 pt-2">
                  <button type="submit" disabled={sending} className="border px-6 py-3 mono text-xs uppercase tracking-widest hover:bg-[var(--ink)] hover:text-[var(--bg)] transition disabled:opacity-60" style={{ borderColor: 'var(--ink)' }}>
                    {sending ? 'Sending…' : mode === 'message' ? 'Send Message →' : 'Request Meeting →'}
                  </button>
                  {sent && <span className="mono text-xs" style={{ color: 'var(--muted)' }}>Message sent successfully.</span>}
                  {error && <span className="mono text-xs" style={{ color: 'var(--muted)' }}>{error}</span>}
                </div>
                <p className="mono text-[10px] uppercase tracking-widest opacity-60">
                  Submitting sends your {mode === 'booking' ? 'booking request' : 'message'} through the website to {profile.email}.
                </p>
              </form>
            </div>
          </div>
        </section>
      );
    }
    function Field({ label, value, onChange, type = 'text', textarea, required, options, min }) {
      const baseClass = "mt-2 w-full bg-transparent border-b py-3 outline-none focus:border-[var(--ink)] transition";
      const baseStyle = { borderColor: 'var(--rule)', color: 'var(--ink)' };
      return (
        <label className="block">
          <span className="mono text-[10px] uppercase tracking-[0.4em]" style={{ color: 'var(--muted)' }}>{label}{required && ' *'}</span>
          {options ? (
            <select required={required} value={value} onChange={(e) => onChange(e.target.value)}
                    className={baseClass} style={baseStyle}>
              {options.map(o => <option key={o} value={o}>{o}</option>)}
            </select>
          ) : textarea ? (
            <textarea required={required} value={value} onChange={(e) => onChange(e.target.value)} rows={5}
                      className={`${baseClass} resize-none`} style={baseStyle} />
          ) : (
            <input required={required} type={type} min={min} value={value} onChange={(e) => onChange(e.target.value)}
                   className={baseClass} style={baseStyle} />
          )}
        </label>
      );
    }

    function Newsletter() {
      const [email, setEmail] = useState('');
      const [done, setDone] = useState(false);
      const sub = (e) => { e.preventDefault(); setDone(true); setEmail(''); };
      return (
        <section className="px-6 md:px-10 py-20 border-t" style={{ borderColor: 'var(--rule)' }}>
          <div className="max-w-7xl mx-auto grid md:grid-cols-2 gap-10 items-end">
            <div>
              <div className="mono text-[10px] uppercase tracking-[0.4em] mb-4" style={{ color: 'var(--muted)' }}>Newsletter</div>
              <h3 className="serif text-3xl md:text-5xl leading-tight">Quarterly notes on new work, books, and small obsessions.</h3>
            </div>
            <form onSubmit={sub} className="flex border-b" style={{ borderColor: 'var(--ink)' }}>
              <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} placeholder="your@email.com"
                     className="flex-1 bg-transparent py-3 outline-none mono text-sm" style={{ color: 'var(--ink)' }} />
              <button className="mono text-xs uppercase tracking-widest px-4">Subscribe →</button>
            </form>
            {done && <p className="mono text-[10px] uppercase tracking-widest md:col-start-2" style={{ color: 'var(--muted)' }}>Thanks — you're on the list.</p>}
          </div>
        </section>
      );
    }

    function Footer() {
      return (
        <footer className="px-6 md:px-10 lg:pl-60 py-16 border-t mono text-xs" style={{ borderColor: 'var(--rule)', color: 'var(--muted)' }}>
          <div className="max-w-7xl mx-auto grid md:grid-cols-4 gap-8 mb-12">
            <div className="md:col-span-2">
              <div className="serif text-2xl mb-2" style={{ color: 'var(--ink)' }}>{profile.name}</div>
              <p className="max-w-sm">{profile.studio}, an architecture practice in {profile.location} working across residential, cultural, and adaptive-reuse projects.</p>
            </div>
            <div>
              <div className="uppercase tracking-widest mb-3" style={{ color: 'var(--ink)' }}>Site</div>
              <ul className="space-y-2">
                <li><a href="#work" className="ul-link">Work</a></li>
                <li><a href="#about" className="ul-link">About</a></li>
                <li><a href="#services" className="ul-link">Services</a></li>
                <li><a href="#contact" className="ul-link">Contact</a></li>
              </ul>
            </div>
            <div>
              <div className="uppercase tracking-widest mb-3" style={{ color: 'var(--ink)' }}>Elsewhere</div>
              <ul className="space-y-2">
                <li><a href={profile.social.instagram} target="_blank" rel="noreferrer" className="ul-link">Instagram</a></li>
                <li><a href={profile.cv} download className="ul-link">CV (PDF)</a></li>
              </ul>
            </div>
          </div>
          <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between gap-2 pt-6 border-t uppercase tracking-widest" style={{ borderColor: 'var(--rule)' }}>
            <span>© {new Date().getFullYear()} {profile.name} · Made with care</span>
            <a href="#top" className="ul-link">Back to top ↑</a>
          </div>
        </footer>
      );
    }

    function BackToTop({ visible }) {
      if (!visible) return null;
      return (
        <a href="#top"
           className="fixed bottom-6 right-6 z-30 mono text-[10px] uppercase tracking-widest border px-3 py-2 backdrop-blur transition hover:bg-[var(--ink)] hover:text-[var(--bg)]"
           style={{ borderColor: 'var(--rule)', background: 'color-mix(in srgb, var(--bg) 70%, transparent)' }}>
          ↑ Top
        </a>
      );
    }

    // ──────────────────────────────────────────────────────────────────
    // ROOT
    // ──────────────────────────────────────────────────────────────────
    function App() {
      const [theme, toggleTheme] = useTheme();
      const [fs, toggleFs] = useFullscreen();
      const activeSection = useActiveSection();
      const [loading, setLoading] = useState(true);
      const [active, setActive] = useState(null);
      const [activePdf, setActivePdf] = useState(null);
      const [activeCoursePdf, setActiveCoursePdf] = useState(null);
      const [scrolled, setScrolled] = useState(false);
      const [showTop, setShowTop] = useState(false);
      const [scrollY, setScrollY] = useState(0);
      const progress = useScrollProgress();
      useReveal();
      useCursor();

      useEffect(() => {
        document.documentElement.style.setProperty('--scroll-progress', progress.toFixed(2));
      }, [progress]);

      useEffect(() => {
        const t = setTimeout(() => setLoading(false), 900);
        return () => clearTimeout(t);
      }, []);
      useEffect(() => {
        const onScroll = () => {
          setScrolled(window.scrollY > 40);
          setShowTop(window.scrollY > 800);
          setScrollY(window.scrollY);
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      return (
        <>
          <Loader done={!loading} />
          <div className="progress-bar" style={{ width: `${progress}%` }} />
          <Nav theme={theme} toggleTheme={toggleTheme} scrolled={scrolled} fs={fs} toggleFs={toggleFs} />
          <SideDots active={activeSection} />
          <main className="lg:pl-60">
            <Hero scrollY={scrollY} />
            <Services />
            <Work onOpen={setActive} scrollY={scrollY} />
            <About />
            <Experience />
            <Certifications onOpenPdf={setActiveCoursePdf} />
            <Coursework onOpenPdf={setActiveCoursePdf} />
            <Skills />
            <Contact />
          </main>
          <Footer />
          <Lightbox project={active} onClose={() => setActive(null)} />
          <PdfViewer item={activePdf} onClose={() => setActivePdf(null)} />
          <CourseViewer item={activeCoursePdf} onClose={() => setActiveCoursePdf(null)} />
          <BackToTop visible={showTop} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
